<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Annie Gu Style Gradient</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .hero {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 { font-size: 5rem; font-weight: 500; margin: 0; letter-spacing: -2px; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Annie Gu</h1>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uMouse;
            uniform vec2 uResolution;

            // Simplex Noise Function
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
            float snoise(vec2 v) {
                const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                vec2 i  = floor(v + dot(v, C.yy));
                vec2 x0 = v - i + dot(i, C.xx);
                vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz;
                x12.xy -= i1;
                i = mod289(i);
                vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
                vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                m = m*m; m = m*m;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5;
                vec3 ox = floor(x + 0.5);
                vec3 a0 = x - ox;
                m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
                vec3 g;
                g.x  = a0.x  * x0.x  + h.x  * x0.y;
                g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / uResolution.xy;
                
                // Mouse interaction distance
                float dist = distance(uv, uMouse);
                float mouseStrength = smoothstep(0.5, 0.0, dist);

                // Creating the "Cloudy" base noise
                float n = snoise(uv * 1.5 + uTime * 0.1);
                n += 0.5 * snoise(uv * 2.5 - uTime * 0.05);
                
                // Add mouse influence to the noise
                n += mouseStrength * 0.8;

                // Color Mapping (Heatmap logic)
                vec3 black  = vec3(0.01, 0.01, 0.02);
                vec3 purple = vec3(0.3, 0.1, 0.6);   // Deep Purple
                vec3 orange = vec3(0.9, 0.4, 0.2);   // Hot Orange
                vec3 white  = vec3(1.0, 0.9, 0.8);   // Soft White center

                // Layer the colors based on noise intensity
                vec3 color = mix(black, purple, smoothstep(0.0, 0.5, n));
                color = mix(color, orange, smoothstep(0.4, 0.8, n));
                color = mix(color, white, smoothstep(0.7, 1.1, n));

                // Add grain/dither to match the screenshot texture
                float grain = (fract(sin(dot(uv, vec2(12.9898,78.233)*uTime)) * 43758.5453) - 0.5) * 0.05;
                color += grain;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const uniforms = {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0.5, 0.5) },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
            fragmentShader,
            uniforms
        });

        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

        window.addEventListener('mousemove', (e) => {
            // Map mouse to 0.0 - 1.0 range
            uniforms.uMouse.value.x = e.clientX / window.innerWidth;
            uniforms.uMouse.value.y = 1.0 - (e.clientY / window.innerHeight);
        });

        function animate(time) {
            uniforms.uTime.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
